# Test database: `pnpm test:db` starts it and loads the fixture.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: phonebook_test
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d phonebook_test']
      interval: 2s
      timeout: 3s
      retries: 30
